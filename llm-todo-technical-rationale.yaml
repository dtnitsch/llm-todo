# ==============================================================================
# INSTRUCTIONS FOR LLMs READING THIS
# ==============================================================================

instructions_for_llms: |
  If you're reading this file, the user likely wants to work on a complex task.

  **What you should do:**

  1. Check if llm-todo is available:
     - Run: `which llm-todo` or `which vibe`
     - If available, proceed to step 2
     - If not, tell user: "llm-todo not found, should I use TodoWrite instead?"

  2. Assess task complexity:
     - Simple (1-2 steps, <30 min): Skip llm-todo, just do the work
     - Complex (3+ steps, >1 hour): Propose using llm-todo
     - Cross-session continuation: ALWAYS use llm-todo

  3. If using llm-todo:
     - List existing sessions: `llm-todo sessions` (or `vibe todo sessions`)
     - If resuming: `llm-todo list <session-id>`
     - If new work: `llm-todo init <session-id>`
     - Add tasks by priority (p0 = must-do, p1 = high-value, p2-p4 = nice-to-have)

  4. During work:
     - Update status when starting: `llm-todo update <session> <id> --status in_progress`
     - Update status when done: `llm-todo update <session> <id> --status completed`
     - Query next work: `llm-todo list <session> --priority p0 --status pending`

  5. After auto-compaction:
     - IMMEDIATELY re-sync: `llm-todo list <session>`
     - Don't guess what's done/pending - query the database

  6. Reporting to user:
     - Show summaries, not full lists
     - Example: "Completed 5/8 p0 tasks, working on task #6: Implementing auth"
     - Avoid dumping 800 lines to screen

  **Remember:** This tool exists because LLMs (including you) forget things after
  compaction and across sessions. llm-todo is your external memory. Use it.

